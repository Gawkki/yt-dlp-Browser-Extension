<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>yt-dlp Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <p id="host" class="host" role="status">Checking helper…</p>

  <label for="url">Link</label>
  <input id="url" type="url" spellcheck="false" placeholder="https://…">

  <div class="row">
    <div>
      <label for="format">Format</label>
      <select id="format">
        <option value="best">Best video (MP4)</option>
        <option value="1080">Video up to 1080p</option>
        <option value="720">Video up to 720p</option>
        <option value="480">Video up to 480p</option>
        <option value="mp3">Audio only (MP3)</option>
        <option value="m4a">Audio only (M4A)</option>
      </select>
    </div>
    <div>
      <label for="cookies">Use login from</label>
      <select id="cookies">
        <option value="">Nothing</option>
        <option value="extension">This browser</option>
        <option value="firefox">Firefox</option>
        <option value="chrome">Chrome</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="chromium">Chromium</option>
        <option value="safari">Safari</option>
      </select>
    </div>
  </div>

  <label for="outdir">Save to folder</label>
  <input id="outdir" type="text" spellcheck="false" placeholder="Default: Downloads/yt-dlp-bridge">

  <button id="go" type="button">Download</button>
  <p id="note" class="note" hidden></p>

  <ul id="jobs" class="jobs"></ul>
  <button id="clear" type="button" class="link" hidden>Clear finished</button>

  <script src="popup.js"></script>
</body>
</html>
